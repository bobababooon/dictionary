<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不規則動詞辞書</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    #search {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 16px;
      box-sizing: border-box;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #f0f0f0;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>不規則動詞辞書</h1>

    <input type="text" id="search" placeholder="検索...">

    <table>
      <thead>
        <tr>
          <th>
            <button onclick="toggleColumn('base')">
              原形
            </button>
          </th>

          <th>
            <button onclick="toggleColumn('past')">
              過去形
            </button>
          </th>

          <th>
            <button onclick="toggleColumn('pp')">
              過去分詞
            </button>
          </th>

          <th>
            <button onclick="toggleColumn('meaning')">
              意味
            </button>
          </th>
        </tr>
      </thead>

      <tbody id="verbTable"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
