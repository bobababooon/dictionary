<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>不規則動詞辞書</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: sans-serif;
      background: #f5f5f5;
    }

    .container {
      width: 100%;
      max-width: 100%;
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 16px;
    }

    #search {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .buttons button {
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    .buttons button:active {
      transform: scale(0.97);
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px 8px;
      text-align: center;
      font-size: 15px;
    }

    th {
      background: #f0f0f0;
      position: sticky;
      top: 0;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 20px;
      }

      th, td {
        font-size: 14px;
        padding: 10px 6px;
      }

      .buttons button {
        font-size: 14px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>不規則動詞辞書</h1>

    <input type="text" id="search" placeholder="検索...">

    <div class="buttons">
      <button onclick="toggleColumn('base')">原形</button>
      <button onclick="toggleColumn('past')">過去形</button>
      <button onclick="toggleColumn('pp')">過去分詞</button>
      <button onclick="toggleColumn('meaning')">意味</button>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>原形</th>
            <th>過去形</th>
            <th>過去分詞</th>
            <th>意味</th>
          </tr>
        </thead>

        <tbody id="verbTable"></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
